<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Value - OTC Desk Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 420px;
            background: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #f7931a;
            margin-bottom: 8px;
        }
        .logo span { color: #fff; }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 25px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab.active {
            background: #f7931a;
            color: #000;
        }
        .form-content { display: none; }
        .form-content.active { display: block; }
        .input-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #f7931a;
        }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #f7931a;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        button[type="submit"]:hover { background: #ff9f2a; }
        .msg {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .error { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); }
        .success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Deep<span>Value</span></div>
        <div class="subtitle">OTC Desk Portal</div>
        
        <div class="tabs">
            <div class="tab active" data-tab="login">SIGN IN</div>
            <div class="tab" data-tab="register">CREATE ACCOUNT</div>
        </div>
        
        <div id="login-form" class="form-content active">
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit">ACCESS PORTAL</button>
            </form>
        </div>
        
        <div id="register-form" class="form-content">
            <form id="registerForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="registerUsername" placeholder="Choose username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Create password" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                </div>
                <button type="submit">CREATE ACCOUNT</button>
            </form>
        </div>
        
        <div class="msg error" id="errorMsg"></div>
        <div class="msg success" id="successMsg"></div>
        
        <div class="footer">Secure bitcoin native mandem since 2016</div>
    </div>

    <script>
        const API_URL = 'https://deep-value-otc.onrender.com';

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab, .form-content').forEach(el => el.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-form`).classList.add('active');
                hideMsgs();
            });
        });

        function hideMsgs() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsgs();
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUsername').value,
                    password: document.getElementById('loginPassword').value
                }),
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = `${API_URL}/dashboard`;
            } else {
                showError(data.error || 'Login failed');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsgs();
            const pw = document.getElementById('registerPassword').value;
            const cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) return showError('Passwords do not match');
            
            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('registerUsername').value,
                    password: pw
                })
            });
            const data = await res.json();
            if (data.success) {
                showSuccess('Account created! You can now sign in.');
                document.getElementById('registerForm').reset();
                setTimeout(() => document.querySelector('[data-tab="login"]').click(), 1500);
            } else {
                showError(data.error || 'Registration failed');
            }
        });
    </script>
</body>
</html>
