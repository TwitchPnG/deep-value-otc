<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Value - OTC Desk Portal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { width: 420px; background: #141414; border: 1px solid #333; border-radius: 12px; padding: 40px; }
.logo { text-align: center; font-size: 28px; font-weight: 800; color: #f7931a; margin-bottom: 8px; }
.logo span { color: #fff; }
.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
.input-group { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
input { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; }
input:focus { outline: none; border-color: #f7931a; }
button[type="submit"] { width: 100%; padding: 14px; background: #f7931a; color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
button[type="submit"]:hover { background: #ff9f2a; }
.msg { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; text-align: center; display: none; }
.error { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid rgba(244, 67, 54, 0.3); display: block; }
.footer { text-align: center; margin-top: 25px; color: #555; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<div class="logo">Deep<span>Value</span></div>
<div class="subtitle">OTC Desk Portal</div>
<form id="loginForm">
<div class="input-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Enter username" required></div>
<div class="input-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password" required></div>
<button type="submit">ACCESS PORTAL</button>
</form>
<div class="msg" id="errorMsg"></div>
<div class="footer">Securing bitcoin native mandem since 2016</div>
</div>
<script>
const API_URL = 'https://deep-value-otc.onrender.com';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
document.getElementById('errorMsg').style.display = 'none';
const res = await fetch(API_URL + '/api/login', {
method: 'POST', headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
username: document.getElementById('loginUsername').value,
password: document.getElementById('loginPassword').value
}), credentials: 'include'
});
const data = await res.json();
if (data.success) {
window.location.href = 'dashboard.html';
} else {
const el = document.getElementById('errorMsg');
el.textContent = data.error || 'Login failed';
el.className = 'msg error';
}
});
</script>
</body>
</html>
